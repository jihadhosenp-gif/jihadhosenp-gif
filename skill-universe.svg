<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="t d"><title id="t">Skill universe</title><desc id="d">Five technology orbits around a central developer core: Frontend, Backend, Database, Tools and Creative tech. Filled nodes are working knowledge, hollow nodes are skills still being learned.</desc><defs><style>
.ring{animation:flow 30s linear infinite}
.core{animation:spin 40s linear infinite}
.n{animation:pulse 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-200}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
