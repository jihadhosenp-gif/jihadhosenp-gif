<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="t d"><title id="t">Jihad Hosen — Full-Stack Developer</title><desc id="d">A cinematic wireframe core with orbit rings and spatial typography on a deep-ink background.</desc><defs><style>
